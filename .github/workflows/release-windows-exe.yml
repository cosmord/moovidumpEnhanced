name: Build and publish Windows executable

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de la release a la que se adjuntará el ejecutable"
        required: true
        type: string

permissions: {}

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        shell: pwsh
        run: .\build_exe.ps1

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\MooviDumpEnhanced.exe")) {
            throw "dist\MooviDumpEnhanced.exe was not generated."
          }

      - name: Upload executable to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$env:RELEASE_TAG" "dist\MooviDumpEnhanced.exe" --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload the executable to release $env:RELEASE_TAG."
          }
