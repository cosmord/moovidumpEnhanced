<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f0e8" />
    <title>MooviDump Enhanced Web</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #e9eee8;
            --panel: #fffdf8;
            --panel-2: #f1f5ef;
            --line: #d9d2c5;
            --text: #1d2420;
            --muted: #4f5d54;
            --accent: #b7f34a;
            --accent-strong: #4f7412;
            --ink: #1d2420;
            --danger: #f07863;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 320px;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            background: linear-gradient(180deg, #e9eee8 0%, #f6f8f4 100%);
            color: var(--text);
        }

        .shell {
            max-width: 1180px;
            margin: 0 auto;
            padding: 32px 28px 48px;
        }

        .hero {
            background: var(--ink);
            border-radius: 24px;
            padding: 32px;
            color: #fffdf8;
            box-shadow: 0 18px 38px rgba(29, 36, 32, 0.16);
        }

        h1 {
            margin: 0 0 8px;
            max-width: 12ch;
            font-family: Georgia, serif;
            font-size: clamp(2.5rem, 6vw, 4.8rem);
            line-height: 0.95;
            letter-spacing: -0.03em;
        }

        .subtitle {
            margin: 0;
            max-width: 55ch;
            color: #cbd4c9;
            line-height: 1.55;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 22px;
            box-shadow: 0 8px 20px rgba(29, 36, 32, 0.05);
        }

        .card h2 {
            margin: 0 0 12px;
            font-family: Georgia, serif;
            font-size: 22px;
            letter-spacing: -0.02em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            color: var(--muted);
            font-weight: 700;
        }

        input,
        textarea {
            width: 100%;
            min-height: 46px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--panel-2);
            color: var(--text);
            padding: 12px 14px;
            font: inherit;
            transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
        }

        textarea {
            min-height: 96px;
            resize: vertical;
        }

        input[type="checkbox"] {
            width: 20px;
            min-height: 20px;
            margin: 0;
            accent-color: var(--accent-strong);
        }

        .check-label {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            min-height: 46px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--panel-2);
            color: var(--text);
            cursor: pointer;
        }

        input:focus-visible,
        textarea:focus-visible,
        button:focus-visible,
        .course-item:has(input:focus-visible) {
            outline: 3px solid rgba(137, 191, 25, 0.35);
            outline-offset: 2px;
        }

        input:focus,
        textarea:focus {
            border-color: var(--accent-strong);
            background: var(--panel);
            box-shadow: 0 0 0 3px rgba(137, 191, 25, 0.12);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        button {
            border: 0;
            min-height: 46px;
            border-radius: 10px;
            padding: 12px 18px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.12s ease, opacity 0.12s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
            transform: none;
        }

        .primary {
            background: var(--accent);
            color: var(--ink);
            box-shadow: 0 6px 0 var(--accent-strong);
        }

        .primary:hover:not(:disabled) {
            background: #c9ff6c;
        }

        .secondary {
            background: var(--ink);
            color: var(--text);
            color: #fffdf8;
        }

        .danger {
            background: #ffe0d9;
            color: #8d3224;
        }

        .muted {
            color: var(--muted);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--panel-2);
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        .hero .pill {
            background: rgba(183, 243, 74, 0.16);
            color: var(--accent);
        }

        .course-list {
            display: grid;
            gap: 10px;
            margin-top: 12px;
            max-height: 430px;
            overflow: auto;
            padding-right: 4px;
        }

        .course-item {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 10px;
            min-height: 58px;
            padding: 12px 14px;
            background: #faf7f0;
            border: 1px solid var(--line);
            border-radius: 10px;
            cursor: pointer;
            transition: border-color 0.16s ease, background 0.16s ease, transform 0.16s ease;
        }

        .course-item:hover {
            background: #fffefb;
            border-color: var(--accent-strong);
            transform: translateX(2px);
        }

        .course-item strong {
            display: block;
        }

        .course-item small {
            color: var(--muted);
        }

        .log {
            margin-top: 12px;
            background: #202923;
            border-radius: 10px;
            border: 1px solid #39473c;
            padding: 14px;
            min-height: 280px;
            max-height: 460px;
            overflow: auto;
            font: 12px/1.5 Consolas, monospace;
            white-space: pre-wrap;
            color: #dff5be;
        }

        .status {
            color: var(--accent-strong);
            font-weight: 700;
        }

        .hero .status {
            color: var(--accent);
        }

        .split {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
        }

        @media (max-width: 980px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .shell {
                padding: 20px 16px 36px;
            }

            .hero,
            .card {
                padding: 20px;
            }
        }

        @media (max-width: 560px) {

            .hero .split,
            .toolbar {
                align-items: flex-start;
                flex-direction: column;
            }

            h1 {
                font-size: 3.2rem;
            }

            .actions {
                display: grid;
                grid-template-columns: 1fr;
            }

            button {
                width: 100%;
            }

            .course-item {
                grid-template-columns: auto 1fr;
            }

            .course-item .pill {
                grid-column: 2;
                justify-self: start;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="shell">
        <section class="hero">
            <div class="split">
                <div>
                    <h1>MooviDump Enhanced Web</h1>
                    <p class="subtitle">Servidor local para listar cursos, lanzar descargas y seguir el progreso en
                        tiempo real.</p>
                </div>
                <div class="pill">Modo navegador local</div>
            </div>
        </section>

        <section class="grid">
            <div class="card">
                <h2>Credenciales</h2>
                <div class="form-grid">
                    <div class="field">
                        <label for="site">Moodle site</label>
                        <input id="site" type="url" inputmode="url" autocomplete="url" required
                            value="https://moovi.uvigo.gal" />
                    </div>
                    <div class="field">
                        <label for="jobs">Workers</label>
                        <input id="jobs" type="number" min="1" max="12" inputmode="numeric" value="4" />
                    </div>
                    <div class="field">
                        <label for="username">Usuario</label>
                        <input id="username" autocomplete="username" required />
                    </div>
                    <div class="field">
                        <label for="password">Contraseña</label>
                        <input id="password" type="password" autocomplete="current-password" required />
                    </div>
                    <div class="field">
                        <label for="courseIds">IDs de cursos (opcional)</label>
                        <textarea id="courseIds" placeholder="1684,1685,1702"></textarea>
                    </div>
                    <div class="field">
                        <label for="saveEnv">Persistencia</label>
                        <label class="check-label" for="saveEnv">
                            <input id="saveEnv" type="checkbox" />
                            <span>Guardar credenciales en .env</span>
                        </label>
                    </div>
                </div>
                <div class="actions">
                    <button type="button" class="secondary" id="loadCourses">Cargar cursos</button>
                    <button type="button" class="primary" id="startDownload">Iniciar descarga</button>
                    <button type="button" class="danger" id="cancelDownload" disabled>Cancelar</button>
                </div>
            </div>

            <div class="card">
                <div class="toolbar">
                    <h2>Cursos</h2>
                    <span class="pill" id="courseCount">0 visibles</span>
                </div>
                <div class="course-list" id="courseList">
                    <div class="muted">Carga cursos para empezar.</div>
                </div>
            </div>
        </section>

        <section class="card" style="margin-top: 18px;">
            <div class="toolbar">
                <h2>Estado y log</h2>
                <div class="status" id="runStatus" role="status" aria-live="polite">Preparado</div>
            </div>
            <div class="log" id="log" role="log" aria-live="polite" aria-label="Registro de actividad"></div>
        </section>
    </main>

    <script>
        const state = {
            courses: [],
            selected: new Set(),
            sessionId: null,
            eventSource: null,
        };

        const $ = (id) => document.getElementById(id);
        const log = $("log");
        const runStatus = $("runStatus");
        const courseList = $("courseList");
        const courseCount = $("courseCount");
        const cancelDownload = $("cancelDownload");

        function appendLog(text) {
            log.textContent += text;
            log.scrollTop = log.scrollHeight;
        }

        function setStatus(text) {
            runStatus.textContent = text;
        }

        function renderCourses() {
            courseList.innerHTML = "";
            courseCount.textContent = `${state.courses.length} visibles`;

            if (!state.courses.length) {
                courseList.innerHTML = '<div class="muted">No hay cursos cargados.</div>';
                return;
            }

            for (const course of state.courses) {
                const item = document.createElement('label');
                item.className = 'course-item';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = state.selected.has(String(course.id));
                checkbox.dataset.courseId = String(course.id);

                const details = document.createElement('div');
                const displayName = document.createElement('strong');
                displayName.textContent = course.display_name || `course_${course.id}`;
                const courseId = document.createElement('small');
                courseId.textContent = `ID ${course.id}`;
                details.append(displayName, courseId);

                const fullname = document.createElement('span');
                fullname.className = 'pill';
                fullname.textContent = course.fullname || 'Visible';

                item.append(checkbox, details, fullname);
                checkbox.addEventListener('change', (event) => {
                    const id = String(course.id);
                    if (event.target.checked) state.selected.add(id); else state.selected.delete(id);
                });
                courseList.appendChild(item);
            }
        }

        async function loadCourses() {
            setStatus('Cargando cursos...');
            appendLog('\n=== Carga de cursos ===\n');

            const payload = {
                site: $('site').value.trim(),
                username: $('username').value.trim(),
                password: $('password').value,
                saveEnv: $('saveEnv').checked,
            };

            const response = await fetch('/api/courses', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });

            const data = await response.json();
            if (!response.ok) {
                setStatus('Error');
                appendLog(`ERROR: ${data.error || 'No se pudieron cargar los cursos'}\n`);
                return;
            }

            state.courses = data.courses || [];
            state.selected = new Set(state.courses.map((course) => String(course.id)));
            renderCourses();
            setStatus(`Cursos cargados: ${state.courses.length}`);
            appendLog(`Cursos cargados: ${state.courses.length}\n`);
        }

        function selectedCourseIds() {
            if ($('courseIds').value.trim()) {
                return $('courseIds').value.split(',').map((value) => value.trim()).filter(Boolean);
            }
            return Array.from(state.selected);
        }

        async function startDownload() {
            if (!state.courses.length) {
                await loadCourses();
                if (!state.courses.length) return;
            }

            setStatus('Iniciando descarga...');
            appendLog('\n=== Descarga ===\n');
            cancelDownload.disabled = false;

            const payload = {
                site: $('site').value.trim(),
                username: $('username').value.trim(),
                password: $('password').value,
                force: false,
                jobs: Number($('jobs').value || '4'),
                allCourses: !$('courseIds').value.trim(),
                courseIds: selectedCourseIds(),
                saveEnv: $('saveEnv').checked,
            };

            const response = await fetch('/api/download/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });

            const data = await response.json();
            if (!response.ok) {
                setStatus('Error');
                appendLog(`ERROR: ${data.error || 'No se pudo iniciar la descarga'}\n`);
                cancelDownload.disabled = true;
                return;
            }

            state.sessionId = data.sessionId;
            setStatus(`Sesión ${state.sessionId}`);
            openStream(state.sessionId);
        }

        function openStream(sessionId) {
            if (state.eventSource) state.eventSource.close();
            state.eventSource = new EventSource(`/api/sessions/${sessionId}/events`);
            state.eventSource.addEventListener('log', (event) => {
                const payload = JSON.parse(event.data);
                appendLog(payload.line);
            });
            state.eventSource.addEventListener('status', (event) => {
                const payload = JSON.parse(event.data);
                setStatus(payload.status);
                if (payload.status !== 'running') {
                    cancelDownload.disabled = true;
                    state.eventSource.close();
                }
            });
            state.eventSource.addEventListener('done', (event) => {
                const payload = JSON.parse(event.data);
                appendLog(`\nProceso finalizado con código ${payload.exitCode}.\n`);
                cancelDownload.disabled = true;
                state.eventSource.close();
            });
            state.eventSource.onerror = () => {
                appendLog('\n[stream cerrado]\n');
            };
        }

        async function cancelSession() {
            if (!state.sessionId) return;
            await fetch(`/api/sessions/${state.sessionId}/cancel`, { method: 'POST' });
            setStatus('Cancelando...');
        }

        $('loadCourses').addEventListener('click', loadCourses);
        $('startDownload').addEventListener('click', startDownload);
        cancelDownload.addEventListener('click', cancelSession);
    </script>
</body>

</html>
