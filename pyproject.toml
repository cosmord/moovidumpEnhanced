[project]
name = "moovidump-enhanced"
version = "0.1.0"
description = "MooviDump Enhanced launcher and Moodle dump tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
